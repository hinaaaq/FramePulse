name: Deploy Cloudflare Worker

on:
  push:
    branches: [ main, master ]
    paths:
      - 'backend/cloudflare_worker.js'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate Secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "::error::Secret CLOUDFLARE_API_TOKEN atau CLOUDFLARE_ACCOUNT_ID belum diisi di GitHub Secrets!"
            exit 1
          fi

      - name: Deploy Worker to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler deploy backend/cloudflare_worker.js \
            --name framepulse-api \
            --compatibility-date 2024-09-23 \
            --keep-vars

name: Release FramePulse APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (contoh: v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Decode Permanent Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 belum diisi di GitHub Settings -> Secrets -> Actions!"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "${{ github.workspace }}/release.jks"

      - name: Build Signed Release APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Prepare APK, SHA-256 & Optional VirusTotal Scan
        id: pkg
        env:
          VT_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          fi
          APK_SRC="app/build/outputs/apk/release/app-release.apk"
          APK_OUT="FramePulse-${TAG}-signed.apk"
          cp "$APK_SRC" "$APK_OUT"

          SHA256=$(sha256sum "$APK_OUT" | awk '{print $1}')
          echo "$SHA256  $APK_OUT" > SHA256SUMS.txt

          VT_STATUS="Verifikasi mandiri lewat SHA-256 di link VirusTotal di bawah."
          if [ -n "$VT_API_KEY" ]; then
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              -X POST "https://www.virustotal.com/api/v3/files" \
              -H "x-apikey: $VT_API_KEY" \
              -F "file=@$APK_OUT")
            if [ "$HTTP_CODE" = "200" ]; then
              VT_STATUS="APK telah diunggah otomatis ke VirusTotal saat build."
            fi
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "apk=$APK_OUT" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "vt_status=$VT_STATUS" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.pkg.outputs.tag }}"
          APK="${{ steps.pkg.outputs.apk }}"
          SHA="${{ steps.pkg.outputs.sha256 }}"
          VT_NOTE="${{ steps.pkg.outputs.vt_status }}"

          cat << NOTES > release_notes.md
          ## FramePulse ${TAG} (Stable Release)

          ### Cara Pasang & Update
          1. Download file **\`${APK}\`** di bawah ini dan langsung pasang (tanpa perlu root).
          2. **Update Tanpa Uninstall:** File APK ini ditandatangani dengan kunci rilis permanen. Untuk versi berikutnya, cukup install APK baru langsung di atas versi lama — seluruh pengaturan, tema, lisensi Pro, dan riwayat benchmark tetap aman. *(Jika sebelumnya memakai versi debug/dev, uninstall versi debug satu kali saja sebelum memasang v1.0.0.)*

          ### Verifikasi Keamanan & Integritas
          - **SHA-256:** \`${SHA}\`
          - **VirusTotal:** [Cek hasil scan VirusTotal untuk APK ini](https://www.virustotal.com/gui/file/${SHA})
          - *${VT_NOTE}*
          NOTES

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" SHA256SUMS.txt --clobber
            gh release edit "$TAG" --notes-file release_notes.md
          else
            gh release create "$TAG" "$APK" SHA256SUMS.txt \
              --title "FramePulse ${TAG} Stable" \
              --notes-file release_notes.md
          fi

      - name: Cleanup Keystore
        if: always()
        run: rm -f "${{ github.workspace }}/release.jks"

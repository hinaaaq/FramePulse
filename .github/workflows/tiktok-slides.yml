name: Generate TikTok Promo Slides

on:
  workflow_dispatch:
    inputs:
      app_version:
        description: "App version label (e.g. v1.1.0)"
        required: true
        default: "v1.1.0"
  release:
    types: [published]

jobs:
  render-slides:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Pillow & Fonts
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-dejavu-core fonts-liberation
          pip install pillow
      - name: Render 5 TikTok Carousel PNGs
        env:
          APP_VERSION: ${{ github.event.inputs.app_version || github.event.release.tag_name || 'v1.1.0' }}
          OUT_DIR: promo_slides
        run: python scripts/generate_slides.py
      - name: Upload Slides Artifact
        uses: actions/upload-artifact@v4
        with:
          name: framepulse-tiktok-slides-${{ github.event.inputs.app_version || github.event.release.tag_name || 'v1.1.0' }}
          path: promo_slides/*.png
